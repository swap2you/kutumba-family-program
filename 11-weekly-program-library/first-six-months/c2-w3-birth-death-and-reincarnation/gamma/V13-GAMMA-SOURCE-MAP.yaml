title: Birth, Death and Reincarnation
primary_verse: BG 2.22
primary_url: https://vedabase.io/en/library/bg/2/22/
devanagari: 'वासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोऽपराणि । तथा शरीराणि विहाय जीर्णान्यन्यानि संयाति नवानि देही ॥ २२ ॥'
iast: 'vāsāṁsi jīrṇāni yathā vihāya navāni gṛhṇāti naro ’parāṇi / tathā śarīrāṇi vihāya jīrṇāny anyāni saṁyāti navāni dehī'
teaching_meaning: 'As a person puts on new garments, giving up old ones, the embodied self similarly accepts new bodies, giving up old ones — taught calmly, without fear tactics for children.'
memory_line: 'Birth and death are changes of dress for the eternal self.'
mechanic: 'Analogy with limits'
