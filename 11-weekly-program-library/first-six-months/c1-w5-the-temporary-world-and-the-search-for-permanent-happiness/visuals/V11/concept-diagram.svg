  <rect x="80" y="140" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="135" y="170" text-anchor="middle" font-size="12">Temporary</text><rect x="320" y="140" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="375" y="170" text-anchor="middle" font-size="12">Fades</text><rect x="80" y="280" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="135" y="310" text-anchor="middle" font-size="12">Lasting</text><rect x="320" y="280" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="375" y="310" text-anchor="middle" font-size="12">Offer</text>
