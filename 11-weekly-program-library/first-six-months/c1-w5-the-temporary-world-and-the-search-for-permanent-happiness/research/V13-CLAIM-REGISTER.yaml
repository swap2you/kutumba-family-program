week: C1-W5
primary: BG 8.15
may_claim:
  - Temporary things can be used well but cannot provide permanent fulfillment (BG 8.15 teaching meaning).
  - Ordinary lawful enjoyment and family affection are not worthless.
  - Enjoyment can become gratitude and service.
must_not_claim:
  - Material things and family affection are worthless.
  - Depression or mental-health diagnostic claims as doctrine.
  - Science proves Kṛṣṇa or the metaphysics of BG 8.15.
  - Official temple/BBT approval of KUTUMBA packets.
deferral_line: >-
  I don't want to guess. I will verify that from Śrīla Prabhupāda's books / our source packet and come back to you.
safeguards:
  - No depression/mental-health claims.
  - No shame of ordinary enjoyment.
