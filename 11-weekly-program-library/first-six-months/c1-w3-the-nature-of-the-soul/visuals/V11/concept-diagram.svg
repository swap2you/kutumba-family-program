<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
  <title>C1-W3 What the jiva is / is not</title>
  <rect width="800" height="420" fill="#faf8f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-family="Segoe UI,sans-serif">C1-W3: What the jiva is / is not</text>
  <rect x="300" y="80" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="355" y="110" text-anchor="middle" font-size="12">Jiva</text><rect x="80" y="240" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="135" y="270" text-anchor="middle" font-size="12">Serves</text><rect x="300" y="240" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="355" y="270" text-anchor="middle" font-size="12">Not God</text><rect x="520" y="240" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/><text x="575" y="270" text-anchor="middle" font-size="12">Not body</text>
  <text x="400" y="390" text-anchor="middle" font-size="12">The jīva is eternal, conscious, individual, minute, and related to Kṛṣṇa in service — not </text>
  <text x="400" y="410" text-anchor="middle" font-size="10" fill="#666">BG 2.20 · KUTUMBA-original · human review required</text>
</svg>
