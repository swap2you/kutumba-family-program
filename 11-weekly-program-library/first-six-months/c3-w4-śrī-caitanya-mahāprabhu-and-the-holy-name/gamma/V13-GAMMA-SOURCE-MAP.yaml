week_id: C3-W4
title: Śrī Caitanya Mahāprabhu and the Holy Name
primary_verse: CC Antya 20.12
primary_url: https://vedabase.io/en/library/cc/antya/20/12/
devanagari: 'চেতোদর্পণমার্জনং ভবমহাদাবাগ্নিনির্বাপণং শ্রেয়ঃকৈরবচন্দ্রিকাবিতরণং বিদ্যাবধূজীবনম্ । আনন্দাম্বুধিবর্ধনং প্রতিপদং পূর্ণামৃতাস্বাদনং সর্বাত্মস্নপনং পরং বিজয়তে শ্রীকৃষ্ণসঙ্কীর্তনম্ ॥ ১২ ॥'
iast: 'ceto-darpaṇa-mārjanaṁ bhava-mahā-dāvāgni-nirvāpaṇaṁ / śreyaḥ-kairava-candrikā-vitaraṇaṁ vidyā-vadhū-jīvanam / ānandāmbudhi-vardhanaṁ prati-padaṁ pūrṇāmṛtāsvādanaṁ / sarvātma-snapanaṁ paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam'
teaching_meaning: 'All victory to śrī-kṛṣṇa-saṅkīrtana — which cleanses the mirror of the heart, extinguishes the forest fire of material existence, spreads the moonlight of good fortune, is the life of knowledge, expands the ocean of bliss, enables tasting full nectar at every step, and bathes the self — supreme.'
memory_line: 'Paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam.'
