<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" role="img">
  <rect width="612" height="792" fill="#FFF8E8"/>
  <text x="306" y="80" text-anchor="middle" font-size="22" fill="#5B1933">CC Antya 20.12 / Śikṣāṣṭaka 1 context</text>
  <text x="40" y="160" font-size="16">चेतोदर्पणमार्जनं भवमहादावाग्निनिर्वापणम् । श्रेय:कैरवचन्द्रिकावितरणं विद्यावधूजी</text>
  <text x="40" y="260" font-size="14">ceto-darpaṇa-mārjanaṁ bhava-mahā-dāvāgni-nirvāpaṇam / śreyaḥ-kairava-candrikā-vitaraṇaṁ vi</text>
  <text x="40" y="360" font-size="14">Chanting the holy name cleanses the mirror of the heart, extinguishes the forest fire of material existence, and spreads</text>
  <text x="40" y="700" font-size="10">https://vedabase.io/en/library/cc/antya/20/12/</text>
  <text x="40" y="730" font-size="10">KUTUMBA teaching meaning — not labeled as BBT translation</text>
</svg>
