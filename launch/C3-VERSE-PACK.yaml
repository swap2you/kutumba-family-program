- week: C3-W1
  reference: BG 5.29
  devanagari: भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम् । सुहृदं सर्वभूतानां ज्ञात्वा मां
    शान्तिमृच्छति ॥ २९ ॥
  iast: bhoktāraṁ yajña-tapasāṁ sarva-loka-maheśvaram / suhṛdaṁ sarva-bhūtānāṁ jñātvā
    māṁ śāntim ṛcchati
  kutumba_teaching_meaning: Knowing the Lord as the enjoyer of sacrifice and austerity,
    the proprietor of all worlds, and the friend of all beings — one attains peace.
  url: https://vedabase.io/en/library/bg/5/29/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C3-W2
  reference: BG 7.7
  devanagari: 'मत्त: परतरं नान्यत्किञ्चिदस्ति धनञ्जय । मयि सर्वमिदं प्रोतं सूत्रे
    मणिगणा इव ॥ ७ ॥'
  iast: mattaḥ parataraṁ nānyat kiñcid asti dhanañ-jaya / mayi sarvam idaṁ protaṁ
    sūtre maṇi-gaṇā iva
  kutumba_teaching_meaning: There is no truth superior to Kṛṣṇa; everything rests
    upon Him as pearls are strung on a thread.
  url: https://vedabase.io/en/library/bg/7/7/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C3-W3
  reference: BG 4.34
  devanagari: 'तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया । उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिन:
    ॥ ३४ ॥'
  iast: tad viddhi praṇipātena paripraśnena sevayā / upadekṣyanti te jñānaṁ jñāninas
    tattva-darśinaḥ
  kutumba_teaching_meaning: Approach those who have seen the truth — with humility,
    inquiry, and service — and they will instruct you in knowledge.
  url: https://vedabase.io/en/library/bg/4/34/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C3-W4
  reference: CC Antya 20.12 / Śikṣāṣṭaka 1 context
  devanagari: चेतोदर्पणमार्जनं भवमहादावाग्निनिर्वापणम् । श्रेय:कैरवचन्द्रिकावितरणं
    विद्यावधूजीवनम् ॥
  iast: ceto-darpaṇa-mārjanaṁ bhava-mahā-dāvāgni-nirvāpaṇam / śreyaḥ-kairava-candrikā-vitaraṇaṁ
    vidyā-vadhū-jīvanam
  kutumba_teaching_meaning: Chanting the holy name cleanses the mirror of the heart,
    extinguishes the forest fire of material existence, and spreads the moonlight
    of auspiciousness — the life of all knowledge.
  url: https://vedabase.io/en/library/cc/antya/20/12/
  rights_status: Sanskrit from VedaBase Śikṣāṣṭaka context; KUTUMBA teaching meaning
    original; verify local chanting sheet.
- week: C3-W5
  reference: ŚB 7.5.23–24
  devanagari: 'श्रवणं कीर्तनं विष्णो: स्मरणं पादसेवनम् । अर्चनं वन्दनं दास्यं सख्यमात्मनिवेदनम्
    ॥'
  iast: śravaṇaṁ kīrtanaṁ viṣṇoḥ smaraṇaṁ pāda-sevanam / arcanaṁ vandanaṁ dāsyaṁ sakhyam
    ātma-nivedanam
  kutumba_teaching_meaning: Hearing, chanting, remembering, serving the Lord's feet,
    worship, offering prayers, becoming a servant, friendship, and full self-surrender
    — the nine processes of bhakti.
  url: https://vedabase.io/en/library/sb/7/5/23-24/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
