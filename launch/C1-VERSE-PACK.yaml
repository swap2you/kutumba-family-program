- week: C1-W1
  reference: ŚB 1.2.18
  devanagari: नष्टप्रायेष्वभद्रेषु नित्यं भागवतसेवया । भगवत्युत्तमश्लोके भक्तिर्भवति
    नैष्ठिकी ॥ १८ ॥
  iast: naṣṭa-prāyeṣv abhadreṣu nityaṁ bhāgavata-sevayā / bhagavaty uttama-śloke bhaktir
    bhavati naiṣṭhikī
  kutumba_teaching_meaning: When we regularly hear and serve the Bhāgavata (book and
    devotee association), troubles in the heart are cleared and steady devotion to
    the Lord becomes established.
  url: https://vedabase.io/en/library/sb/1/2/18/
