    original; no full purport; no BBT English translation copied.
- week: C1-W2
  reference: BG 2.13
  devanagari: देहिनोऽस्मिन् यथा देहे कौमारं यौवनं जरा । तथा देहान्तरप्राप्तिर्धीरस्तत्र
    न मुह्यति ॥ १३ ॥
  iast: dehino ’smin yathā dehe kaumāraṁ yauvanaṁ jarā / tathā dehāntara-prāptir dhīras
    tatra na muhyati
  kutumba_teaching_meaning: Just as the embodied self passes through childhood, youth,
    and old age in one body, the sober person is not bewildered when the self passes
    to another body.
  url: https://vedabase.io/en/library/bg/2/13/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original; no full purport.
- week: C1-W3
  reference: BG 2.20
  devanagari: न जायते म्रियते वा कदाचिन्नायं भूत्वा भविता वा न भूयः । अजो नित्यः शाश्वतोऽयं
    पुराणो न हन्यते हन्यमाने शरीरे ॥ २० ॥
  iast: na jāyate mriyate vā kadācin nāyaṁ bhūtvā bhavitā vā na bhūyaḥ / ajo nityaḥ
    śāśvato ’yaṁ purāṇo na hanyate hanyamāne śarīre
  kutumba_teaching_meaning: The soul is never born and never dies; unborn, eternal,
    and everlasting — not destroyed when the body is destroyed.
  url: https://vedabase.io/en/library/bg/2/20/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original; no full purport.
- week: C1-W4
  reference: ŚB 11.9.29
  devanagari: 'लब्ध्वा सुदुर्लभमिदं बहुसम्भवान्ते मानुष्यमर्थदमनित्यमपीह धीर: । तूर्णं
    यतेत न पतेदनुमृत्यु यावन्नि:श्रेयसाय विषय: खलु सर्वत: स्यात् ॥ २९ ॥'
  iast: labdhvā su-durlabham idaṁ bahu-sambhavānte mānuṣyam artha-dam anityam apīha
    dhīraḥ / tūrṇaṁ yateta na pated anu-mṛtyu yāvan niḥśreyasāya viṣayaḥ khalu sarvataḥ
    syāt
  kutumba_teaching_meaning: After many births one obtains the rare human form — temporary
    yet able to give the highest purpose. A sober person should quickly endeavor for
    the ultimate good while this body lasts.
  url: https://vedabase.io/en/library/sb/11/9/29/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original; no full purport.
- week: C1-W5
  reference: BG 8.15
  devanagari: 'मामुपेत्य पुनर्जन्म दु:खालयमशाश्वतम् । नाप्नुवन्ति महात्मान: संसिद्धिं
    परमां गता: ॥ १५ ॥'
  iast: mām upetya punar janma duḥkhālayam aśāśvatam / nāpnuvanti mahātmānaḥ saṁsiddhiṁ
    paramāṁ gatāḥ
  kutumba_teaching_meaning: Having attained the Lord, great souls do not return again
    to this temporary world of misery; they have reached the highest perfection.
  url: https://vedabase.io/en/library/bg/8/15/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original; no full purport.
