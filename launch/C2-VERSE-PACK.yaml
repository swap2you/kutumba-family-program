- week: C2-W1
  reference: BG 3.9
  devanagari: यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः । तदर्थं कर्म कौन्तेय मुक्तसङ्गः
    समाचर ॥ ९ ॥
  iast: yajñārthāt karmaṇo ’nyatra loko ’yaṁ karma-bandhanaḥ / tad-arthaṁ karma kaunteya
    mukta-saṅgaḥ samācara
  kutumba_teaching_meaning: Work done for the satisfaction of the Lord frees us from
    bondage; otherwise action binds. Therefore act with detachment for His purpose.
  url: https://vedabase.io/en/library/bg/3/9/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C2-W2
  reference: BG 18.63
  devanagari: इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया । विमृश्यैतदशेषेण यथेच्छसि
    तथा कुरु ॥ ६३ ॥
  iast: iti te jñānam ākhyātaṁ guhyād guhyataraṁ mayā / vimṛśyaitad aśeṣeṇa yathecchasi
    tathā kuru
  kutumba_teaching_meaning: The Lord has explained confidential knowledge; now deliberate
    fully and then act as you choose — responsibility remains with the living being.
  url: https://vedabase.io/en/library/bg/18/63/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C2-W3
  reference: BG 2.22
  devanagari: वासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोऽपराणि । तथा शरीराणि विहाय
    जीर्णान्यन्यानि संयाति नवानि देही ॥ २२ ॥
  iast: vāsāṁsi jīrṇāni yathā vihāya navāni gṛhṇāti naro ’parāṇi / tathā śarīrāṇi
    vihāya jīrṇāny anyāni saṁyāti navāni dehī
  kutumba_teaching_meaning: As a person puts on new garments, giving up old ones,
    the embodied self similarly accepts new bodies, giving up old ones — taught calmly,
    without fear tactics for children.
  url: https://vedabase.io/en/library/bg/2/22/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C2-W4
  reference: BG 14.5
  devanagari: 'सत्त्वं रजस्तम इति गुणा: प्रकृतिसम्भवा: । निबध्नन्ति महाबाहो देहे देहिनमव्ययम्
    ॥ ५ ॥'
  iast: sattvaṁ rajas tama iti guṇāḥ prakṛti-sambhavāḥ / nibadhnanti mahā-bāho dehe
    dehinam avyayam
  kutumba_teaching_meaning: Goodness, passion, and ignorance — born of material nature
    — bind the eternal embodied self within the body.
  url: https://vedabase.io/en/library/bg/14/5/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
- week: C2-W5
  reference: BG 7.14
  devanagari: दैवी ह्येषा गुणमयी मम माया दुरत्यया । मामेव ये प्रपद्यन्ते मायामेतां
    तरन्ति ते ॥ १४ ॥
  iast: daivī hy eṣā guṇa-mayī mama māyā duratyayā / mām eva ye prapadyante māyām
    etāṁ taranti te
  kutumba_teaching_meaning: This divine illusory energy made of the modes is hard
    to overcome — but those who surrender to the Lord cross beyond it.
  url: https://vedabase.io/en/library/bg/7/14/
  rights_status: Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning
    original.
