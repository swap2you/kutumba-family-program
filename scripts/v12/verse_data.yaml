c3_w1:
  week: C3-W1
  reference: "BG 5.29"
  source_language: Sanskrit
  devanagari: "भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम् । सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति ॥ २९ ॥"
  iast: "bhoktāraṁ yajña-tapasāṁ sarva-loka-maheśvaram / suhṛdaṁ sarva-bhūtānāṁ jñātvā māṁ śāntim ṛcchati"
  kutumba_teaching_meaning: "Knowing the Lord as the enjoyer of sacrifice and austerity, the proprietor of all worlds, and the friend of all beings — one attains peace."
  url: "https://vedabase.io/en/library/bg/5/29/"
  keywords: [enjoyer, proprietor, friend]
  teaches: "Who is God — enjoyer, proprietor, and friend."
  scope_boundary: "Does not yet unfold personal Kṛṣṇa-līlā depth (W2)."
  rights_status: "Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning original."

c3_w2:
  week: C3-W2
  reference: "BG 7.7"
  source_language: Sanskrit
  devanagari: "मत्त: परतरं नान्यत्किञ्चिदस्ति धनञ्जय । मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव ॥ ७ ॥"
  iast: "mattaḥ parataraṁ nānyat kiñcid asti dhanañ-jaya / mayi sarvam idaṁ protaṁ sūtre maṇi-gaṇā iva"
  kutumba_teaching_meaning: "There is no truth superior to Kṛṣṇa; everything rests upon Him as pearls are strung on a thread."
  url: "https://vedabase.io/en/library/bg/7/7/"
  keywords: [Krishna, supreme, thread]
  teaches: "Kṛṣṇa is the Supreme Personality of Godhead."
  scope_boundary: "No invented līlā dialogue; source-bound only."
  rights_status: "Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning original."

c3_w3:
  week: C3-W3
  reference: "BG 4.34"
  source_language: Sanskrit
  devanagari: "तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया । उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिन: ॥ ३४ ॥"
  iast: "tad viddhi praṇipātena paripraśnena sevayā / upadekṣyanti te jñānaṁ jñāninas tattva-darśinaḥ"
  kutumba_teaching_meaning: "Approach those who have seen the truth — with humility, inquiry, and service — and they will instruct you in knowledge."
  url: "https://vedabase.io/en/library/bg/4/34/"
  keywords: [guru, inquiry, service]
  teaches: "Guru, sādhu, and śāstra — how we receive spiritual knowledge."
  scope_boundary: "Does not authorize independent speculative gurus."
  rights_status: "Sanskrit verse text from VedaBase display; KUTUMBA teaching meaning original."

c3_w4:
  week: C3-W4
  reference: "CC Antya 20.12 (Śikṣāṣṭaka 1)"
  source_language: Sanskrit
  devanagari: "चेतोदर्पणमार्जनं भवमहादावाग्निनिर्वापणम् । श्रेयःकैरवचन्द्रिकावितरणं विद्यावधूजीवनम् ॥ आनन्दाम्बुधिवर्धनं प्रतिपदं पूर्णामृतास्वादनम् । सर्वात्मस्नपनं परं विजयते श्रीकृष्णसङ्कीर्तनम् ॥"
  iast: "ceto-darpaṇa-mārjanaṁ bhava-mahā-dāvāgni-nirvāpaṇaṁ śreyaḥ-kairava-candrikā-vitaraṇaṁ vidyā-vadhū-jīvanam ānandāmbudhi-vardhanaṁ prati-padaṁ pūrṇāmṛtāsvādanaṁ sarvātma-snapanaṁ paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam"
  kutumba_teaching_meaning: "Let there be all victory for śrī-kṛṣṇa-saṅkīrtana — which cleanses the mirror of the heart, extinguishes the blazing forest fire of material existence, spreads the moonlight of good fortune, is the life of all education, expands the ocean of bliss, gives a taste of full nectar at every step, and bathes the self of everyone."
  url: "https://vedabase.io/en/library/cc/antya/20/12/"
  keywords: [holy-name, Caitanya, sankirtana, Sikshastaka]
  teaches: "Śrī Caitanya Mahāprabhu and the holy name — full Śikṣāṣṭaka 1."
  scope_boundary: "No invented Caitanya dialogue; use authorised sources only; do not truncate before paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam."
  rights_status: "Sanskrit verse text from VedaBase display (CC Antya 20.12 / Śikṣāṣṭaka 1); KUTUMBA teaching meaning original; verify local chanting sheet."

c3_w5:
  week: C3-W5
  reference: "ŚB 7.5.23–24"
  source_language: Sanskrit
  devanagari: "श्रीप्रह्राद उवाच श्रवणं कीर्तनं विष्णो: स्मरणं पादसेवनम् । अर्चनं वन्दनं दास्यं सख्यमात्मनिवेदनम् ॥ २३ ॥ इति पुंसार्पिता विष्णौ भक्तिश्चेन्नवलक्षणा । क्रियेत भगवत्यद्धा तन्मन्येऽधीतमुत्तमम् ॥ २४ ॥"
  iast: "śrī-prahrāda uvāca — śravaṇaṁ kīrtanaṁ viṣṇoḥ smaraṇaṁ pāda-sevanam / arcanaṁ vandanaṁ dāsyaṁ sakhyam ātma-nivedanam // iti puṁsārpitā viṣṇau bhaktiś cen nava-lakṣaṇā / kriyeta bhagavaty addhā tan manye ’dhītam uttamam"
  kutumba_teaching_meaning: "Prahlāda lists nine processes of bhakti unto Viṣṇu — hearing, chanting, remembering, serving the Lord's feet, worship, prayers, servitude, friendship, and full self-surrender — and teaches that such dedicated bhakti is the topmost learning."
  url: "https://vedabase.io/en/library/sb/7/5/23-24/"
  keywords: [nine-processes, bhakti, hearing-chanting, Prahlada]
  teaches: "The nine processes of bhakti as a family map."
  scope_boundary: "Does not require children to master all nine at once; both verses 23 and 24 must be present."
  rights_status: "Sanskrit verse text from VedaBase ŚB 7.5.23–24; KUTUMBA teaching meaning original."

