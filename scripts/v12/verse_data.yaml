  week: C2-W6
  reference: "Cycle 2 review (BG 18.63 center)"
  source_language: Sanskrit
  devanagari: "(review C2 primaries)"
  iast: "BG 3.9 · BG 18.63 · BG 2.22 · BG 14.5 · BG 7.14"
  kutumba_teaching_meaning: "Choice, consequence, and the modes must form one coherent family practice — synthesis, not new doctrine overload."
